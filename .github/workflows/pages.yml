name: Deploy GitHub Pages

# Publishes the live site: master's site/ folder goes to the root of the
# gh-pages branch, which GitHub Pages serves (Settings -> Pages -> Source:
# "Deploy from a branch", gh-pages, / (root)).
#
# pr-preview/ is left untouched so pull request previews (see
# pr-preview.yml) survive each live deploy.
#
# The checkout is pinned to master, so running this by hand from any branch
# (Actions -> Deploy GitHub Pages -> Run workflow) still publishes master's
# site, never unmerged work.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Deploy site/ to the root of gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
