<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladywell Neighbourhood Doughnut</title>
    <link rel="stylesheet" href="css/styles.css?v=46">
</head>
<body>
    <header>
        <button class="ward-pill" id="ward-pill-home">← Ladywell</button>
    </header>

    <main>
        <div class="content-grid">
            <div class="left-column">
                <div class="intro-section">
                    <h1 class="desktop-headline">Ladywell's neighbourhood doughnut</h1>
                </div>

                <div class="chart-section">
                    <div id="doughnut-chart"></div>
                </div>

                <!-- Torn paper divider (mobile only) -->
                <div class="torn-divider"></div>
            </div>

            <!-- Dimensions panel (right column on desktop, below chart on mobile) -->
            <div class="dimensions-panel" id="dimensions-panel">
                <div class="dimension-section">
                    <h2 class="section-heading" id="social-heading">SOCIAL</h2>
                    <div class="dimension-cards" id="social-cards">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <div class="dimension-section">
                    <h2 class="section-heading" id="ecological-heading">ECOLOGICAL</h2>
                    <div class="dimension-cards" id="ecological-cards">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <a class="spend-entry-card" href="spending.html">
                    <span class="spend-entry-text">
                        <span class="spend-entry-title">Does council spending line up with local needs?</span>
                        <span class="spend-entry-sub">See how Lewisham's budget is being spent and how they've changed since 2016</span>
                    </span>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </a>
            </div>
        </div>

        <footer class="page-footer">
            <p>Built on: Kate Raworth's Doughnut Economics</p>
            <p>Last updated: <span id="generated-at">—</span></p>
        </footer>
    </main>

    <!-- Dimension detail overlay -->
    <div id="dimension-overlay" class="dimension-overlay hidden">
        <div class="overlay-content">
            <button class="back-button" id="back-button">← Back</button>
            <div class="detail-container" id="detail-container">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="js/chart.js?v=14"></script>
    <script src="js/app.js?v=149"></script>
</body>
</html>
